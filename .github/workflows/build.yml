name: build

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: mac
          - os: windows-latest
            asset: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Build
        run: |
          python -m pip install --upgrade -r requirements-build.txt
          pyinstaller --noconfirm dupfinder.spec
      - name: Package (mac)
        if: runner.os == 'macOS'
        run: |
          VER=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" dupfinder.py)
          cd dist && ditto -c -k --keepParent DupFinder.app "DupFinder-$VER-mac.zip"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path dupfinder.py -Pattern "^__version__ = '(.+)'").Matches[0].Groups[1].Value
          Compress-Archive -Path dist/DupFinder.exe -DestinationPath "dist/DupFinder-$ver-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DupFinder-${{ matrix.asset }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
